
name: YouTube AI Agent - Setup Check

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  setup-check:
    name: Verify YouTube Agent Files
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify agent instruction files
        run: |
          test -f master-agent-instructions.md
          test -f research-agent.md
          test -f content-growth-agent.md
          echo "All agent instruction files found."

      - name: Verify channel configuration
        run: |
          test -f config/channel-profile.yml
          echo "Channel configuration found."

      - name: Verify task templates
        run: |
          test -f tasks/README.md
          test -f tasks/research-request.md
          test -f tasks/content-request.md
          echo "All task files found."

      - name: Verify content production system
        run: |
          test -f tasks/content-production/README.md
          test -f tasks/content-production/content-package-template.md
          test -f tasks/content-production/content-agent-workflow.md
          echo "Content production system verified."

      - name: Verification complete
        run: |
          echo "YouTube AI Agent workspace verified."
          echo "Human approval is required before publishing."
